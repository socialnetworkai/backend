apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: EMAIL_CONFIRMATION_CODE_LIFETIME_SECS
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: EMAIL_CONFIRMATION_CODE_LIFETIME_SECS
             - name: RECOVERY_URL
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: RECOVERY_URL
             - name: MAIL_MODULE_HOST
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: MAIL_MODULE_HOST
             - name: MAIL_MODULE_USER
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: MAIL_MODULE_USER
             - name: MAIL_MODULE_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: MAIL_MODULE_PASSWORD
             - name: MAIL_MODULE_FROM
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: MAIL_MODULE_FROM
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: soc-net-main-production-config-secret
                   key: DATABASE_URL
