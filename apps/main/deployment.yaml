apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: EMAIL_CONFIRMATION_CODE_LIFETIME_SECS
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: EMAIL_CONFIRMATION_CODE_LIFETIME_SECS
            - name: RECOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: RECOVERY_URL
            - name: MAIL_MODULE_HOST
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: MAIL_MODULE_HOST
            - name: MAIL_MODULE_USER
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: MAIL_MODULE_USER
            - name: MAIL_MODULE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: MAIL_MODULE_PASSWORD
            - name: MAIL_MODULE_FROM
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: MAIL_MODULE_FROM
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: REDIS_URL
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: REDIS_PASSWORD
            - name: REFRESH_TOKEN_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: REFRESH_TOKEN_EXPIRES_IN
            - name: ACCESS_TOKEN_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: ACCESS_TOKEN_EXPIRES_IN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: socnet-main-production-config-secret
                  key: DATABASE_URL
